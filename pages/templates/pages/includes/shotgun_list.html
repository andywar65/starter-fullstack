{% load i18n %}

{% if shots %}
  {% for shot in shots %}
    <div class="card mx-auto" style="margin-top: 60px;{{ shot.get_card_width }}">
      {% include "pages/includes/shotgun_card.html" %}
    </div>
  {% endfor %}
{% else %}
  <div class="card mx-auto"
    style="max-width: 960px; margin-top: 60px;">
    <div class="card-body">
      <p>{% translate "No articles available" %}</p>
    </div>
  </div>
{% endif %}
