{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="shortcut icon" type='image/x-icon' href="{% static 'favicon.ico' %}">
    <!-- Bootstrap CSS -->
    <link href="//maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="{% static 'css/base.css' %}" rel="stylesheet">
    <title>{{ request.site.name }}</title>
    {% block extra-head %}
      <meta property="og:url" content="https://{{ request.site.domain }}{% url 'home' %}">
      <meta property="og:title" content="{{ request.site.name }} - Home">
      {% if logo %}
        <meta property="og:image" content="https://{{ request.site.domain }}{{ logo.image.url }}">
      {% endif %}
      <meta property="og:site_name" content="{{ request.site.name }}">
    {% endblock extra-head %}
  </head>
  <body class="d-flex flex-column h-100" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <div id="navbar"
      hx-get="{% url 'nav_bar' %}"
      hx-trigger="refreshNavbar from:body">
      {% include 'navbar.html' %}
    </div>
    <main class="flex-shrink-0">
      <div id="content" class="container">
        {% block content %}
          <h1>Hello, world!</h1>
        {% endblock content %}
      </div>
    </main>
    {% include 'footer.html' %}
    <!-- Optional JavaScript -->
    <!-- Bootstrap bundled JS -->
    <script crossorigin="anonymous" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/htmx.min.js' %}"></script>
    <script src="{% static 'js/hyperscript.min.js' %}"></script>
    {% block extra-js %}{% endblock extra-js %}
  </body>
</html>
